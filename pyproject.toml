[project]
name = "atlaspi"
version = "6.99.65"
description = "Database geografico storico strutturato per agenti AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
# v6.92.2 (audit R4 hotfix): allineato ignore list alla realta' della
# codebase. Tutte le regole rimaste sono stylistic, non bug:
# - E501: linee >120 — alcune URL nelle docstring superano (no impatto).
# - E741: `l` come iteratore di link/line in chain loops. Convenzione
#   locale (ChainLink → l) leggibile nel contesto; rinomina lasciata
#   come cleanup opportunistico.
# - E402: import non-top — intenzionale in src/main.py (route imports
#   per evitare cicli) e in scripts di seed (env-aware imports).
# - N806: variabili uppercase nel corpo funzione — R (raggio terra) e
#   MAX_DIST_KM (costanti fisiche). Convenzione scientifica vs PEP8.
ignore = ["E501", "E741", "E402", "N806"]

[tool.ruff.lint.per-file-ignores]
# Test files: variabili "unused" sono spesso intenzionali (setup-fixtures,
# pattern di asserzione, demonstrate-then-assert). Stesso per yield-in-for
# che e' un equivalente esplicito di yield-from ma documentato meglio nei
# test di iterazione.
"tests/*.py" = ["F841", "UP028"]

[tool.pytest.ini_options]
testpaths = ["tests"]
